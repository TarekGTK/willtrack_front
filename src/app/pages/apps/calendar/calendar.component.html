<div class="container-fluid">
    <div class="row mb-3">
      <div class="col-md-4">
        <label for="statusFilter">Filtrer par statut</label>
        <select id="statusFilter" class="form-select" [(ngModel)]="selectedStatus" (change)="onStatusChange()">
          <option value="ALL">Tous</option>
          <option value="PLANIFIE">Planifié</option>
          <option value="ACCEPTE">Accepté</option>
          <option value="REFUSE">Refusé</option>
        </select>
      </div>
    </div>
  
    <div class="row">
      <div class="col-md-8">
        <div *ngIf="calendarOptions">
          <full-calendar [options]="calendarOptions"></full-calendar>
        </div>
      </div>
  
      <div class="col-md-4">
        <h5 class="mb-3">Candidatures</h5>
        <div *ngFor="let app of filteredApplications()">
          <div class="card mb-2 shadow-sm" [ngClass]="{
              'bg-danger': getStatusForApplication(app.id) === 'REFUSE',
              'bg-success': getStatusForApplication(app.id) === 'ACCEPTE',
              'bg-warning': getStatusForApplication(app.id) === 'PLANIFIE'
            }">
            <div class="card-body d-flex flex-column">
              <img [src]="app.user.photoProfile" alt="photo" width="50" height="50" class="rounded-circle me-3" />
              <div>
                <strong>{{ app.user.nom }} {{ app.user.prenom }}</strong><br>
                <small>Statut: {{ getStatusForApplication(app.id) || 'Aucun entretien' }}</small>
              </div>
  
              <div class="mt-3">
                <h6>Entrevues</h6>
                <div style="max-height: 200px; overflow-y: scroll;">
                  <div *ngFor="let entretien of app.entretienList">
                    <p>{{ entretien.typeEntretien }} - {{ entretien.statusEntretien }}</p>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
